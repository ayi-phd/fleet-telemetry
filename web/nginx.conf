server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Kubernetes probes
  location = /nginx-health { access_log off; return 200 "ok"; }

  # Server-sent events: no buffering, long read timeout (server sends a heartbeat every 15s).
  location = /api/stream {
    proxy_pass http://dashboard-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
  }

  location /api/ {
    proxy_pass http://dashboard-api:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /auth/ {
    proxy_pass http://rbac-authz:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /admin/ {
    proxy_pass http://rbac-authz:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
